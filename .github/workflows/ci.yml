name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-slim

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Supply-chain gate. Gated at `high` on purpose: advisories come from
            # upstream, not from this repo, and a zero-tolerance gate means any new
            # low-severity advisory anywhere in the dev tree breaks unrelated PRs.
            # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): no patched release exists. Only reached via
            # commitizen > find-node-modules > findup-sync > micromatch at commit time, with
            # patterns from this repo, never untrusted input. Drop the ignore once braces ships a fix.
            - name: Audit dependencies
              run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

            - name: Type check
              run: bun run tsc

            - name: Lint
              run: bun run lint

            - name: Test
              run: bun run test

            - name: Format check
              run: bun run format:check

            - name: Build binary
              run: bun run build
